# winter_wheat — canopy light interception (Beer–Lambert) parameters
# Currency/units: leaf CARBON in mol; LAI and intercepted fraction are dimensionless
#   (m²/m² and a [0,1) fraction). specific_leaf_area is per-area (m²/kg dry matter),
#   pint-validated and converted at the config boundary; carbon_fraction folds it to
#   m²/mol C (the core never sees kg-DM). ground_area (m²) is SCENARIO data, supplied
#   at evaluate time — it is deliberately NOT a crop param here (P4).
#
# Clean-room: values from cited primary literature ONLY. NOT from the unlicensed
#   WOFOST_crop_parameters YAML or PCSE source. See docs/param-file-conventions.md.
#   The intercepted-fraction LAW (1 − exp(−k·LAI)) is Monsi & Saeki [A]. Of the three
#   numeric VALUES, specific_leaf_area is now bound to a primary source [B]; the other
#   two remain provisional, literature-typical placeholders pending the Step-11
#   validation gate — flagged TODO(cite) until bound (per the convention doc's
#   provisional path; never backfilled from WOFOST).
#   ⚠ Both survivors sit under a ~3.5× amplifier: peak LAI compounds a uniform error in
#   any of them through light interception, so a ±2 % disagreement about k is roughly
#   the whole margin of the peak-LAI science band. They are the live provenance queue.
#
# Sources:
#   [A] Monsi, M. & Saeki, T. (1953), "Über den Lichtfaktor in den
#       Pflanzengesellschaften und seine Bedeutung für die Stoffproduktion",
#       Japanese Journal of Botany 14:22–52. (English translation: Ann. Bot.
#       95:549–567, 2005.) — the canopy extinction law.
#   [B] Penning de Vries, F.W.T., Jansen, D.M., ten Berge, H.F.M. & Bakema, A. (1989),
#       "Simulation of Ecophysiological Processes of Growth in Several Annual Crops",
#       Simulation Monographs 29, PUDOC, Wageningen. ISBN 90-220-0937-8. Table 19
#       (p. 100), "Wheat, winter" — read off the page render, not the text layer
#       (the OCR of this book is mangled; see docs/log/canopy-magnitude.md).

name: winter_wheat
process: canopy_light_interception

parameters:
  extinction_coef:
    value: 0.6
    unit: "dimensionless"
    source: "TODO(cite) — provisional, literature-typical (wheat k≈0.4–0.7); primary citation pending Step 11"
  # [B] Table 19 tabulates the RECIPROCAL — specific leaf WEIGHT, 425 kg/ha of leaf per
  # unit LAI for winter wheat (spring wheat is 500) — so the SLA here is 10000 m²/ha ÷
  # 425 kg/ha = 23.53 m²/kg. Basis matches ours: leaf blades, ONE surface, excluding
  # petioles and leaf sheaths (the sheaths are booked to the stem in the same table,
  # which is also the compartment convention allocation.yaml already cites to [B]).
  # ⚠ This RETIRED a `TODO(cite)` placeholder of 22.0 and MOVED THE VALUE +7.0 %, which
  # is a calibration, not a provenance-only edit — it moved goldens. See the unfreeze
  # log in docs/biosphere-reference.md (2026-08-15).
  specific_leaf_area:
    value: 23.53
    unit: "m^2/kg"
    source: "[B], Table 19 p.100, 'Wheat, winter' (425 kg/ha per unit LAI → 10000/425)"
  carbon_fraction:
    value: 0.45
    unit: "dimensionless"
    source: "TODO(cite) — provisional, literature-typical (~0.45 kg C/kg DM); primary citation pending Step 11"
