name: CI

# Phase-7 Step 0 (P7.0) added the Rust job alongside the pre-existing Python gate.
# Phase-7 Step 6 (P7.6) added the `crossport` job — a third job carrying BOTH toolchains,
# so the Python comparator gated the Rust port's snapshots against the 20 frozen goldens.
# ⚠⚠ **That job is gone (2026-08-27, S6 items 1-3) and so is its premise.** There is no
# Python reference to compare against: Rust is the reference, the goldens are its own
# bytes, and every gate the job carried runs under `cargo test` below. The paragraph that
# followed here — "the Rust port has NO reference authority; a parity failure is a finding
# about the Python reference" — inverted with the flip and is kept nowhere as advice.
#
# ⚠ The cross-libm question that job existed for did not go with it. The Ubuntu runner
# uses glibc's libm while the committed goldens were generated on Windows/UCRT, so a
# byte compare of a re-run is last-ULP-different by design off the generation platform.
# That is now handled inside `cargo test`, by classification rather than by a skip:
# `domains::goldens::Numerics` byte-compares the pure-arithmetic goldens everywhere and
# compares the transcendental ones STRUCTURALLY off-platform. See
# docs/native-port-reference.md and `domains/src/goldens.rs`.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python (ruff · pyright · pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync dependencies
        run: uv sync
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Pyright
        run: uv run pyright
      - name: Pytest (fast loop)
        run: uv run pytest -m "not slow"

  rust:
    name: Rust (test · clippy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cargo test
        run: cargo test
      # ⚠⚠ The ONLY place the expensive goldens run. Stage-3 slice S2 gave the reference
      # its own golden comparison (`*/tests/golden_regression.rs`, plan FINDING 3); one
      # entry — the fully-coupled sealed station, ~1.3 M sub-steps over five domains — is
      # `#[ignore]`d because it costs ~100 s at every optimization level (measured: 378 s
      # dev, 116 s at opt-level 2, 93 s release; the cost is the run, not the build). It is
      # therefore off by default locally and ON here. Deleting this step does not fail a
      # test — it silently stops checking the largest assembly in the repo, which is the
      # green-by-skip shape this project has been bitten by twice. The paired control
      # `the_ignored_set_is_exactly_the_expensive_roster` guards the other direction (a
      # second `#[ignore]` appearing), and `ci_still_runs_the_ignored_tests` pins THIS line
      # textually — so deleting the step below is red in `cargo test`, not silent. That
      # guard was added on review after the first draft asserted here that no test could
      # make it, which was false by this repo's own source-grep idiom.
      - name: Cargo test (ignored — the expensive sealed-station golden)
        run: cargo test -- --ignored
      - name: Cargo clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

  # ⚠⚠ THE `crossport` JOB WAS DELETED HERE ON 2026-08-27 (S6 build items 1-3), and the
  # deletion is the point rather than a tidy-up. It ran `uv run pytest tests/crossport/`;
  # that directory is now empty, and `pytest` on an empty directory **exits 5** ("no tests
  # ran"), so leaving the job would have turned a completed retirement into a permanent red
  # that reads like a broken gate. Recorded in the plan before it happened, and done in the
  # same commit as the files.
  #
  # Where its three subjects went: the manifest byte gate into each crate's
  # `tests/manifest_writer.rs` (S2) with its argument-parse control in
  # `config/tests/manifest_cli.rs` (item 1); the golden byte census into
  # `{domains,station}/tests/golden_regression.rs` (S2); the provenance/classification
  # census into the same file, plus `station/tests/regen.rs` for the frozen-golden claim and
  # the regeneration path's validator (items 2-3). All of them run in the `cargo test` job
  # above, on every push — a strictly wider trigger than the Python job they left.
  #
  # ⚠ What is NOT here any more, said plainly: there is no Python job in this workflow. The
  # only Python left in the repo is the PCSE oracle carve-out, which is hand-run, needs the
  # network, and has never been a gate.

  godot-parity:
    name: Cross-boundary parity (Godot cdylib vs headless)
    runs-on: ubuntu-latest
    # Phase-8 Step 8 (P8.8) promotes the Step-1 cross-boundary smoke from a silently-skipped
    # local test to a real gate. This job installs headless Godot AND the Rust toolchain, so
    # the Godot cross-boundary smokes actually RUN: each drives a scenario through the actual
    # ⚠ (they lived in `tests/crossport/test_godot_*.py` until §5y decision 3 moved them to
    # `godot_bridge/tests/cross_boundary.rs`; S6 deleted the Python drivers, and this comment
    # named them for one slice after the step below had stopped using them)
    # `godot_bridge` cdylib Godot loads and asserts the snapshot is byte-identical to the
    # headless `emit_*` reference, with FTZ/DAZ OFF on the stepping thread. This is the genuine
    # glibc-Rust-cdylib-vs-headless FP-environment check the intra-process `session_parity.rs`
    # cannot make. De-risked in a Linux container before landing (the Phase-7-Step-6
    # precedent). The comparisons are same-platform-emit (bit-exact) or Tier-1 (`cabin_gas`,
    # transcendental-free), so the Tier-2 cross-libm bands are not exercised here.
    #
    # `-m "not slow"` excludes the ~4-minute sealed season-crossing smoke (a mandatory-local /
    # release-time gate; its full-horizon parity is already gated intra-process + by the frozen
    # sealed golden). See docs/phase-8-reference.md.
    steps:
      - uses: actions/checkout@v4
      # ⚠ No `Install uv` step: since §5y decision 3 this job runs no Python at all. Removed
      # WITH the driver rather than left behind — an installer for a language nothing in the
      # job uses is the kind of thing that outlives its reason and then looks load-bearing.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install headless Godot 4.7
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            unzip libfontconfig1 libxcursor1 libxinerama1 libxrandr2 libxi6 libgl1 \
            libxext6 libx11-6
          GODOT_VER=4.7-stable
          curl -fL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VER}/Godot_v${GODOT_VER}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp
          sudo mv "/tmp/Godot_v${GODOT_VER}_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          godot --headless --version
      # ⚠ The Python driver is GONE from this job (reference flip, Stage 3, §5y decision 3).
      # The same seventeen smokes now live in `godot_bridge/tests/cross_boundary.rs`; they
      # still shell out to `cargo build -p godot_bridge` (the cdylib Godot dlopen's) and to
      # `cargo run --example emit_*` (the headless reference), and they still drive the real
      # `godot --headless --script`. What changed is the language of the driver, not the
      # coverage — `uv sync` is no longer needed here at all.
      #
      # ⚠ The slow sealed season-crossing run is excluded BY NAME rather than by `#[ignore]`.
      # pytest's `-m slow` is opt-OUT (it runs on the developer machine by default and CI
      # skips it); `#[ignore]` is opt-IN, so using it would have silently stopped that test
      # running on the only machines that ever run it. The filter belongs in CI, not in the
      # source.
      - name: Godot cross-boundary parity smokes (fast)
        run: |
          cd rust
          cargo test -p godot_bridge --test cross_boundary -- --skip sealed_season_crossing
