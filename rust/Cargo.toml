[workspace]
resolver = "2"
members = [
    "crates/config",
    "crates/simcore",
    "crates/domains",
    "crates/station",
    "crates/godot_bridge",
    "crates/authoring",
    "crates/repo_gates",
]

# Phase 7 native port of the frozen Python reference. The Rust crate tree mirrors
# the Python package layout (`simcore` first; `domains` joins in Step 3 when it
# holds the four Phase-5 siblings; `station` joins in Step 5 — no empty speculative
# crates before then). The port has NO reference authority: a divergence from a
# frozen golden is an unfreeze-discipline finding about the Python reference, never
# a silent Rust "fix".
#
# `repo_gates` (reference flip, Stage 3) is the odd one out and deliberately so: its subject
# is this REPOSITORY rather than the simulation — the context budget, the log index/record
# parity, the frozen phase table. It arrived holding ten live gates ported out of
# `tests/test_context_budget.py`, so the "no empty speculative crates" rule below permits it
# (that rule forbids standing a crate up BEFORE it has content); it is dev-only, `publish =
# false`, and nothing in the engine depends on it. See its own manifest for why it is not a
# re-opening of the compile-time reach-out FINDING 1 closed.
#
# `authoring` (Phase-9 Step 4a) is the boundary crate mirroring Python `src/authoring`:
# the rate-expression parser (text→AST). It depends only on `simcore` (for the AST
# types); no YAML dependency yet — runtime scenario-file parsing (decision E) is Step
# 4b/5, deliberately separated so the parse-parity + trajectory-parity crux needs no
# new dep.

# The simulation crates are optimised even in dev/test builds (2026-09-30, the 1/16-day step's
# runtime budget: docs/plans/post-roadmap-step-sixteenth.md, slice 0). Measured on the full
# suite: 496 s -> 110 s test run, for 64 s -> 87 s on a fresh build and 8 s -> 9 s on an
# incremental one. Byte-neutral: Rust does no floating-point contraction or reassociation at
# any opt level, and the goldens are regenerated in --release and compared here. Written in
# this file (not an env var) so the child `cargo` builds `cross_boundary` spawns see it too.
# `godot_bridge` and its heavy `godot` dependency stay unoptimised on purpose. Assertions are
# separate profile keys and stay on.
[profile.dev.package.simcore]
opt-level = 3
[profile.dev.package.domains]
opt-level = 3
[profile.dev.package.station]
opt-level = 3
[profile.dev.package.authoring]
opt-level = 3
[profile.dev.package.config]
opt-level = 3
