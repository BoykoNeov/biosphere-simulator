# winter_wheat — rooted-depth extension (the third aux accumulator) crop params
# Currency/units: NONE — rooted depth is a LENGTH (m), a non-conserved auxiliary
#   accumulator, not a stock. It has no counterparty and is invisible to the conservation
#   gate by construction (simcore.auxiliary). Both values are per-crop constants.
#
# Units discipline (P4 / config/units.py): m/day and m are not conserved-Quantity
#   canonical units, so both are schema-validated, bound-checked floats carrying a
#   declared unit, exact-string guarded at the loader (the senescence/respiration
#   precedent).
#
# Model ([E] p. 137, Listing 7 Line 34):
#   d(depth)/dt = max_extension_rate · f_water · f_temp    (zero at DVS >= 1, and zero
#                                                           once max_rooted_depth is hit)
#   FROOT1      = min(depth / soil_layer_depth, 1)   → multiplies NitrogenUptake's supply
#
#   f_temp is photosynthesis's temperature_factor and f_water is transpiration's
#   water_stress_factor — [E] says to reuse exactly those two responses, so no new curve
#   is introduced. soil_layer_depth is SCENARIO/soil data, not a crop param.
#
# ⚠ ROOTED DEPTH IS NOT A FUNCTION OF ROOT CARBON, BY THE PRIMARY'S OWN INSTRUCTION.
#   [E] p. 136: "The length of fibrous roots can vary enormously without much impact on
#   root weight. Hence, simulation of rooted depth occurs independently of the growth of
#   root mass." [F] Soltani & Sinclair reach the same design independently. Anyone here to
#   "make root carbon do work" should read docs/plans/post-roadmap-root-functional-
#   coupling.md first — that route was measured and refused.
#
# ⚠ THIS MECHANISM IS BIT-IDENTICALLY INERT ON EVERY FROZEN SCENARIO, and was BUILT WITH
#   THAT KNOWN, at the user's explicit direction over a recorded refusal. Nitrogen uptake
#   is demand-bound on every step of every scenario; this gates supply, which has >=1.9x
#   headroom at its tightest. So no golden can catch its removal — the pins in
#   tests/test_root_depth.py are unit-level and mutation-verified for exactly that reason.
#
# Clean-room: values from cited primary literature ONLY, read OFF THE PAGE IMAGE — [E]'s
#   text layer column-collapses Table 25 (18 rate values against 15 species labels; the
#   maximum-depth column renders as "ies) 1.8 1.8 1.0 OM ..."), the same failure mode as
#   its Table 18 and [F]'s Table 17.1. NOT from the unlicensed WOFOST_crop_parameters YAML
#   or PCSE source. See docs/param-file-conventions.md.
#
# PROVENANCE: both values CITED first-hand, and NEITHER is one of [E]'s own estimates —
#   Table 25 flags two rows with "*  estimate" and they are Sugar-beet and Tulip, not
#   wheat. The winter-wheat row is attributed to Gregory et al., 1978.
#
# Sources:
#   [E] Penning de Vries, F.W.T., Jansen, D.M., ten Berge, H.F.M. & Bakema, A. (1989),
#       *Simulation of Ecophysiological Processes of Growth in Several Annual Crops*,
#       Simulation Monographs 29, PUDOC/IRRI. ISBN 90-220-0937-2. **Table 25, p. 137**
#       ("Rates of increase in rooted depth in moist soil at an optimum temperature and
#       the maximum effective rooted depth (i.e., root density >0.1 cm cm-3) for different
#       crop species"), row "Wheat winter": 0.018 m/d, 1.3 m, Gregory et al., 1978.
#       **p. 136** for the rooted-depth definition, the mass-independence statement, the
#       3-5 cm/d general range and "Root growth generally stops around flowering";
#       **p. 137** for the two response factors. Page images, not the text layer.
#   [F] Soltani, A. & Sinclair, T.R., *Modeling Physiology of Crop Development, Growth and
#       Yield*, CABI. Ch. 14 (DEPORT/GRTD/TTSW) and Ch. 18 (FROOT1/SNAVL) — the
#       independent second witness for the form, and the origin of FROOT1.

name: winter_wheat
process: root_depth

parameters:
  max_extension_rate:
    value: 0.018
    unit: "m/day"
    source: "[E] Table 25, p. 137, row 'Wheat winter' (Gregory et al., 1978), read off the page image: rate of increase in rooted depth 0.018 m d-1, i.e. 1.8 cm/day. Table 25's caption states the condition the value holds under — 'in moist soil at an optimum temperature' — which is exactly why the model multiplies it by f_water and f_temp rather than applying it flat; the tabulated number is the UNSTRESSED maximum, not a season average. NOT one of the table's estimates: the '*  estimate' footnote marks Sugar-beet (0.02*) and Tulip (0.02*) only. CONSISTENT WITH THE BODY TEXT, which gives the cross-species range first-hand (p. 136): 'Rooted depth can increase at a rate of 3-5 cm d-1, but soil physical, soil chemical and biological factors can reduce it (Taylor & Klepper, 1978)' — our 1.8 cm/d sits BELOW that general range, which is expected for winter wheat and is the direction a cautious value should err in (a slower crop reaches the layer later, so the gate is if anything too tight rather than too loose). CONTRAST for the sibling row: 'Wheat spring' is 0.012 m/d with a 1.8 m maximum — slower but deeper — so the two wheats are NOT interchangeable and this file is the winter one, matching the frozen crop."
  max_rooted_depth:
    value: 1.3
    unit: "m"
    source: "[E] Table 25, p. 137, row 'Wheat winter' (Gregory et al., 1978), read off the page image: maximum effective rooted depth 1.3 m. The caption defines 'effective' precisely — 'i.e., root density >0.1 cm cm-3' — and p. 136 gives the definition this rests on: 'The rooted depth is defined as the depth from which the crop effectively extracts water. A density of 0.10 cm root length per cm3 of soil volume may be adopted as a lower density limit ... Rooted depth does not refer to the extreme depth where a few roots are still found.' So this is an EXTRACTION depth, not a maximum root penetration, which is the right quantity for a supply gate. ⚠ [E] is candid that the column is approximate and important: p. 137, 'The maximum depth depends on the plant species and ranges from 0.5-1.5 m or more. Table 25 gives some approximate values ... Sensitivity analysis has established this as an important characteristic, though little is known about it in field crops.' Our 1.3 m sits inside that stated 0.5-1.5 m range. ⚠ [E] also names a physical ceiling we do NOT model: a dense layer or shallow soil over bedrock caps the attainable depth, and the model 'uses the shallowest of the rooted depths set by the soil and by the crop' (Listing 7 Line 33). We carry only the CROP cap — the soil cap would be scenario/soil data, and adding it is deferred, not overlooked. MEASURED CONSEQUENCE, recorded so the deferral is honest: this cap is reached around day 140 of open_season while anthesis falls near day 255, so the cap — not [E]'s flowering stop — is what ends extension for the frozen crop."
