# chamber — water cycle closure (condensation + recycling) params
# ⚠ SINCE 2026-10-09 THE FILE HOLDS ONE RATE, NOT TWO (docs/plans/post-roadmap-chamber-dehumidifier.md).
#   condensation_rate was DELETED: its only remaining job was a first-order draw on the vapour
#   BELOW the humidity setting, which a dehumidifier does not make and which emptied the air of a
#   chamber whose crop no longer supplied any. The condenser now removes exactly the excess over
#   humidity_setpoint and nothing below it. The history below describes the rate as it was.
# Currency/units: WATER (kg). This file grouped the TWO first-order rates (1/day) that
#   close the chamber's water cycle — the one cycle Phase 1/2 left open (transpiration
#   drained soil_water to a vapor_sink BOUNDARY; irrigation refilled it from a
#   water_source BOUNDARY). With the plants-owned Transpiration (retargeted to the
#   in-system water_vapor stock), these close the ring:
#     condensation_rate water_vapor → condensate  (the condenser recovers vapor)
#     recycling_rate    condensate  → soil_water  (recovered water returns to the root zone)
#   soil_water → water_vapor → condensate → soil_water closes with no boundary crossing.
#   Both fluxes are first-order in their donor pool (rate · pool, kg/day), self-limiting
#   (→ 0 as the pool → 0), so positivity is structural (rate·dt < 1 keeps the backstop off).
#
# Why both rates live in ONE file (the mineralization.yaml precedent). Conceptually
#   condensation is an atmosphere process and recycling a water-compartment process — but
#   together they ARE the chamber's water return loop, and one dedicated file (loaded by
#   both the atmosphere and water builders, separate objects) keeps the Phase-1
#   transpiration.yaml byte-untouched (the open-field water path is unchanged). The file
#   is named honestly for the loop, not for one of its two halves.
#
# Why first-order (the honest part). First-order means vapor condenses *regardless of
#   humidity* — WRONG for natural atmospheric condensation (which needs supersaturation;
#   that saturation/dew-point refinement needs chamber volume + temperature coupling with
#   zero architectural payoff here), but RIGHT for an engineered condenser + water-recovery
#   loop — a dehumidifier / condensing heat-exchanger at fixed clearance, which is what a
#   sealed bioregenerative life-support chamber actually has (CELSS; Biosphere 2 condensate
#   management).
#
# ⚠ SATURATION IS NO LONGER DEFERRED (2026-09-23, docs/plans/post-roadmap-vapour-saturation.md).
#   The first-order rate above was the WHOLE law until then, and the air held whatever the
#   plot transpired: all three chambers peaked at the same 536.995 mol of vapour in rooms of
#   1000 and 2000 mol, ~20x saturation. The chamber now carries a saturation CEILING —
#   e_s(T) / 101 325 Pa · chamber_air_capacity_mol (FAO-56's cited curve, the standard
#   atmosphere by definition; no new parameter). Transpiration sends the air only its
#   headroom and the rest straight to condensate; condensation removes everything above the
#   ceiling and applies `condensation_rate` to the saturated remainder. So this rate is now
#   the condenser's draw BELOW saturation, not the only thing standing between the plot and
#   the air.
#
# ⚠ THE CONDENSER NOW HOLDS A HUMIDITY SETTING (2026-09-29,
#   docs/plans/post-roadmap-vapour-step-artefact.md). Two changes, one file entry:
#   (1) the ceiling is humidity_setpoint x saturation, not saturation — BVAD's "about 75%"
#       (see its source string for why that is a recorded CHOICE of locus); and
#   (2) transpiration's headroom now counts what the condenser takes in the same step, so a
#       step the plants can fill ends AT the setting. Without (2) the air settled at
#       setting / (1 + condensation_rate x dt) — 0.889 of saturation at dt = 1/4 before this
#       entry — a number set by the step size, not by the chamber.
#   So condensation_rate is now the condenser's draw below the SETTING. ⚠ It still runs below
#   the setting, which a real dehumidifier would not; recorded, not changed.
#   ⚠ CHANGED 2026-10-09: the draw below the setting and its rate are gone (header above).
#
# Sizing discipline (the Step-3 linchpin). The rates are chosen large enough that the
#   in-flight water (water_vapor + condensate ≈ T/k_cond + T/k_rec, T = transpiration
#   flux) stays ≪ soil_water0, so soil_water stays ≫ sw_critical and f_water ≡ 1 — i.e.
#   the carbon/O₂/N trajectory is bit-identical to the pre-cycle sealed run (verified by
#   the golden diff: only the WATER stocks may change). Both rates satisfy rate·dt < 1 at
#   the Euler-daily step for structural positivity (rationed == 0).
#
# Units discipline (P4 / config/units.py): the first-order rates (1/day) are NOT a
#   conserved-Quantity canonical unit, so each is a schema-validated, bound-checked float
#   carrying a declared unit (exact-string guarded at the loader, like decomposition's
#   decomposition_rate / mineralization's two rates). A zero rate is valid (no condensation
#   / no recycling); negative is rejected (it would create water).
#
# Deferred seams: a finite condenser capacity; and the plants reading the CHAMBER'S humidity
#   rather than the weather's VPD (BVAD's own crop transpiration model does, §4.14 Eqn 4-23 —
#   a lead, not built). The controlled relative-humidity setpoint that this line used to defer
#   is humidity_setpoint below (2026-09-29).
#
# Clean-room: values from cited primary literature ONLY. NOT from the unlicensed
#   WOFOST_crop_parameters YAML or PCSE source. See docs/param-file-conventions.md.
#   recycling_rate is a DESIGN choice (condensation_rate was one too, deleted 2026-10-09);
#   humidity_setpoint is cited ([C]).
#
# PROVENANCE (post-roadmap bucket 3 scope C, 2026-07-16 — docs/plans/post-roadmap-citation.md).
#   Both TODO(cite) tags discharged as DESIGN. [A]/[B] establish that an engineered
#   condenser/recycler IS the closed-loop water architecture; neither fixes a RATE.
#
#   THIS FILE'S SCOPE DISPOSITION, recorded because it had fallen through a crack: scope
#   (A)'s two-column table sorted the biosphere params into "7 potential-production files"
#   (oracle-validatable) and "5 non-PP files" (no oracle) — and water_cycle.yaml is in
#   NEITHER. It is a no-oracle file, and therefore scope (C)'s, which was established
#   empirically rather than assumed: the Condensation flow that consumes these params
#   exists ONLY in the `if scenario.sealed:` branch of atmosphere.py, and the oracle
#   trajectory runs `build_season()` — whose default scenario is sealed=False, and whose
#   assembled registry contains no condensation flow at all. So these rates are never even
#   LOADED in an oracle run and cannot move that trajectory. (The 7-vs-5 omission is
#   inherited from scope (A) and is now closed.)
#
# Sources:
#   [A] MacElroy, R.D. & Bredt, J. (1984), "Current concepts and future directions of
#       CELSS", Adv. Space Res. 4(12):221–229 (closed-loop water recovery in controlled
#       ecological life-support — the engineered condenser/recycler this models).
#   [B] Nelson, M., Allen, J., Alling, A., Dempster, W.F. & Silverstone, S. (1993),
#       "Using a closed ecological system to study Earth's biosphere: initial results
#       from Biosphere 2", BioScience 43(4):225–236 (condensate management in a sealed
#       chamber — the fast condenser turnover the rates approximate).
#   [C] NASA (2022), Life Support Baseline Values and Assumptions Document (BVAD), NASA/TP-2015-
#       218570/Rev2, Feb 2022 — §4.5.7 p. 130 and §4.14.1 p. 175 (the plant humidity sentence)
#       and Table 4-1 p. 63 (crew relative humidity 25 / 40 / 75 %).

name: chamber
process: water_cycle

parameters:
  recycling_rate:
    value: 0.5
    unit: "1/day"
    source: "DESIGN — round-number choice, not a literature value: 0.5/day = a chosen ~2-day condensate-return turnover, matched to the condenser's former condensation_rate (deleted 2026-10-09, when the condenser stopped drawing below its setting) so neither half of the ring was the bottleneck. No source can fix a plumbing cadence we invented for a fictional chamber. Closed-loop architecture from [A][B]; the magnitude is ours. Not calibrated."
  humidity_setpoint:
    value: 0.75
    unit: "dimensionless"
    source: "[C] BVAD Rev 2 §4.5.7 p. 130 and §4.14.1 p. 175 (the same paragraph printed twice), verbatim: 'Similarly, plants require higher relative humidity – about 75% – to avoid water stress and minimize nutrient solution usage. Such humidity levels are at the high end for crew comfort.' Taken as the relative humidity the chamber's condenser HOLDS (a fraction of saturation at the step's temperature). ⚠ THAT IS A CHOICE OF LOCUS, not a lookup: the sentence states what plants NEED, not what a condenser is set to, and 'about' makes the value approximate. The humidity claim carries no citation of its own (the Wheeler et al. 1993 in the same paragraph belongs to the CO2 sentence). Cross-check (a consistency check, not a second derivation): 75% is Table 4-1 p. 63's UPPER crew relative humidity (NASA-STD-3001; nominal 40%, typical ISS), which is what 'the high end for crew comfort' says. Bounded (0, 1]: 1 is plain saturation, the model before 2026-09-29. Read off the page images, not only pdftotext. docs/plans/post-roadmap-vapour-step-artefact.md §5."
