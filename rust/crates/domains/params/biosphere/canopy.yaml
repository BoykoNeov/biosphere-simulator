# winter_wheat — canopy light interception (Beer–Lambert) parameters
# Currency/units: leaf CARBON in mol; LAI and intercepted fraction are dimensionless
#   (m²/m² and a [0,1) fraction). specific_leaf_area is per-area (m²/kg dry matter),
#   pint-validated and converted at the config boundary; carbon_fraction folds it to
#   m²/mol C (the core never sees kg-DM). ground_area (m²) is SCENARIO data, supplied
#   at evaluate time — it is deliberately NOT a crop param here (P4).
#
# Clean-room: values from cited primary literature ONLY. NOT from the unlicensed
#   WOFOST_crop_parameters YAML or PCSE source. See docs/param-file-conventions.md.
#   The intercepted-fraction LAW (1 − exp(−k·LAI)) is Monsi & Saeki [A]. All three
#   numeric VALUES are bound: specific_leaf_area and extinction_coef to [B],
#   carbon_fraction to [C]. THIS FILE'S PROVENANCE QUEUE IS EMPTY as of 2026-09-06 — no
#   TODO(cite) remains here (never backfilled from WOFOST).
#   ⚠ EMPTY IS NOT SETTLED. extinction_coef was bound at the value it already carried,
#   over a shelf that disagrees with itself (0.60 / 0.65 / 0.68). Its own `source:` below
#   records the disagreement and the two OPPOSED risks rather than hiding them: a citation
#   that conceals a live alternative is worse than the TODO(cite) that admitted one.
#   ⚠ The "~3.5× amplifier" this header asserted until 2026-09-06 does NOT apply to k,
#   and was refuted in the same record that priced the binding
#   (docs/log/canopy-provenance.md). That elasticity is to a UNIFORM perturbation; k raises
#   absorption at the canopy top and lowers penetration to the base, so it self-cancels in a
#   closed canopy — +8.3 % on k buys +0.78 % of peak LAI, not +30 % (re-measured
#   2026-09-06 through `value_switch`, where 0.60 reproduced the frozen tree in all 8 rows).
#
# ⚠ carbon_fraction WAS THE SECOND SURVIVOR UNTIL 2026-08-15, AND IT WAS NEVER MISSING.
#   ../nitrogen.yaml has carried the IDENTICAL 0.45 bound to [C] since the 2026-07-16
#   citation round, under a documented MUST-EQUAL constraint with this file (both fold
#   it: sla → m²/mol C here, N thresholds → kg N/mol C there). ./crops/potato/canopy.yaml
#   has said so in as many words since 2026-08-11 — "the reference value IS cited, but to
#   a measurement of WHEAT grain/straw" — while this file, the reference the potato file
#   was describing, still said TODO(cite). The citation was one file away, and a crop
#   OVERRIDE was the record of it. Fourth instance of the shape (canopy-regulator,
#   stem-reserve-form, the SLA anchor in test_potato_crop.py): CHECK YOUR OWN SHELF
#   BEFORE TREATING A VALUE AS UNSOURCED. ⚠ Provenance-only — the value does not move,
#   and the manifest regeneration in that commit is the git-visible record that an unfreeze
#   happened. ⚠ This sentence also said "which is exactly why nothing could have gone red"
#   until 2026-09-06. True when written (2026-08-15) and FALSE three days later: slice C7
#   (2026-08-18) made the reference WRITE each manifest from the files it compiles in, so a
#   `source:`-only edit leaves the committed manifest stale and RED until it is regenerated.
#
# Sources:
#   [A] Monsi, M. & Saeki, T. (1953), "Über den Lichtfaktor in den
#       Pflanzengesellschaften und seine Bedeutung für die Stoffproduktion",
#       Japanese Journal of Botany 14:22–52. (English translation: Ann. Bot.
#       95:549–567, 2005.) — the canopy extinction law.
#   [C] Raimanova, I., Svoboda, P., Moulik, M., Wollnerova, J., Haberle, J. (2024), "The
#       Effect of Water Availability on the Carbon Content of Grain and Above- and
#       Belowground Residues in Common and Einkorn Wheat", Plants 13(2):181.
#       https://doi.org/10.3390/plants13020181 (open access; verified 2026-07-16 in
#       ../nitrogen.yaml, which cites the same paper for the same quantity).
#   [B] Penning de Vries, F.W.T., Jansen, D.M., ten Berge, H.F.M. & Bakema, A. (1989),
#       "Simulation of Ecophysiological Processes of Growth in Several Annual Crops",
#       Simulation Monographs 29, PUDOC, Wageningen. ISBN 90-220-0937-8. Table 19
#       (p. 100), "Wheat, winter" — read off the page render, not the text layer
#       (the OCR of this book is mangled; see docs/log/canopy-magnitude.md). ALSO p. 36,
#       the canopy extinction coefficient by leaf-architecture class (bound 2026-09-06,
#       same page-render discipline).

name: winter_wheat
process: canopy_light_interception

parameters:
  extinction_coef:
    value: 0.6
    unit: "dimensionless"
    source: "[B] Penning de Vries et al. (1989), p. 36: ‘about 0.6 for a canopy with erect leaves and 0.8 for one with horizontal leaves (Goudriaan, 1977)’ — an ARCHITECTURE-class PAR extinction coefficient, read off the page render (this book’s OCR is mangled), and winter wheat is an erect-leaved canopy. Coherent with the rest of the file: [B] already sources specific_leaf_area, and Goudriaan is the author of the depth quadrature this domain’s canopy integrates over. ⚠ THE SHELF DISAGREES WITH ITSELF AND THIS IS THE CONSERVATIVE READING, NOT THE ONLY ONE. Soltani & Sinclair (2012) Table 10.1 gives 0.65 for the ‘Wheat’ row under the IDENTICAL equation — but that table’s own caption lists [B] among its sources, so it is partly derived rather than an independent measurement; ibid. Fig. 10.8a gives 0.68 for cv. Zagros from explicitly UNPUBLISHED data, which cannot retire a TODO(cite) in a tree whose rule is cite-the-primary-literature. ⚠ THE TWO RISKS ARE OPPOSED AND NO DIRECTION IS SAFE ON BOTH AXES: on provenance 0.60 may be ~8 % low against the crop-specific reading, while on the GATES 0.60 is the conservative side. Measured 2026-09-04 and re-measured 2026-09-06 (`value_switch extinction_coef=0.60,0.65,0.68 --long`): 0.60 reproduces the frozen tree in all 8 gated rows; 0.65 spends the perennial liveness floor from 5.12 % of clearance to 0.40 % (0.578137 → 0.552202 against > 0.55) and 0.68 puts it BELOW the floor at 0.538913 — and 0.68 is NON-MONOTONE on the observable it was proposed to move (peak LAI 6.058617, below 0.65’s 6.069990). Value unchanged at 0.6, decided by the user 2026-09-06; the disagreement is RECORDED, not resolved. See docs/log/extinction-coef-bound.md and docs/log/canopy-provenance.md"
  # [B] Table 19 tabulates the RECIPROCAL — specific leaf WEIGHT, 425 kg/ha of leaf per
  # unit LAI for winter wheat (spring wheat is 500) — so the SLA here is 10000 m²/ha ÷
  # 425 kg/ha = 23.53 m²/kg. Basis matches ours: leaf blades, ONE surface, excluding
  # petioles and leaf sheaths (the sheaths are booked to the stem in the same table,
  # which is also the compartment convention allocation.yaml already cites to [B]).
  # ⚠ This RETIRED a `TODO(cite)` placeholder of 22.0 and MOVED THE VALUE +7.0 %, which
  # is a calibration, not a provenance-only edit — it moved goldens. See the unfreeze
  # log in docs/biosphere-reference.md (2026-08-15).
  #
  # ⚠ THE POPULATION AND THE TIMING, retrieved 2026-09-06 (docs/log/sla-leaf-population.md).
  # The open question was whether this number is the YOUNG- or the MATURE-leaf value, with
  # a form build owed if it were age-specific. The caption answers it by refusing the
  # question: the constants "are average values for the entire canopy". Neither reading was
  # ever on the page. ⚠ And p. 99 adds a qualification this file did not carry — the
  # constant is not a season average either, but the canopy average sampled at ONE MOMENT:
  # "a fair approximation provided that its value is measured at a proper time, such as at
  # the end of the phase when most assimilates go to the leaves (e.g., development stage 0.5
  # for rice)", with Table 19 giving values "at about this stage".
  #
  # ⚠ WHY THAT DISCHARGES THE ITEM RATHER THAN OPENING ONE: our LOCUS is [B]'s own. p. 98
  # §3.3.3 defines the method this constant serves — "Leaf area is determined by dividing
  # the weight of LIVE LEAVES by the specific leaf weight" — and science::leaf_area_index is
  # exactly `leaf_carbon · sla_per_mol_c / ground_area` over the standing pool, the only
  # consumer of this value. Value, population and application point agree.
  #
  # ⚠ THE ALTERNATIVE [B] OFFERS IS A DIFFERENT LOCUS, NOT A RE-READING OF THIS NUMBER.
  # Table 20 (p. 102) keys a factor SLT to development stage and applies it to NEW leaves,
  # which needs leaf-cohort state this tree does not have by design (P2: LAI is derived, not
  # stored). So "key it to development" is a form build with a new state variable, and it is
  # NOT what reading this constant differently would have been. Two things to know before
  # anyone prices it: winter wheat's own row is 0.,1., 0.33,1.1, 0.36,1.06, 0.43,1.5,
  # 0.53,1.05, 0.62,1., 0.77,0.85, 0.95,1.07, 1.14,1., 2.1,1. — it STARTS AT 1.0 and is a
  # bounded non-monotone wiggle, not the thin→thick ramp p. 99's prose describes (spring
  # wheat's row is the ramp); and [B] itself prices the method as days-to-weeks on the
  # canopy-CLOSURE DATE while "the effect on leaf biomass and on final yield tends to be
  # small".
  specific_leaf_area:
    value: 23.53
    unit: "m^2/kg"
    source: "[B], Table 19 p.100, 'Wheat, winter' (425 kg/ha per unit LAI → 10000/425). POPULATION, retrieved 2026-09-06 off the page render: the table's own caption says these constants 'are average values for the entire canopy' — leaf blades, one surface, excluding petioles and leaf sheaths — so this is NEITHER a young-leaf NOR a mature-leaf value, which is what the open question had assumed it must be one of. TIMING, same retrieval, p. 99: not a season average either, but the canopy average sampled at one moment — 'a fair approximation provided that its value is measured at a proper time, such as at the end of the phase when most assimilates go to the leaves (e.g., development stage 0.5 for rice)', with the table's values being 'at about this stage'. ⚠ The application point agrees with the source: [B] p. 98 §3.3.3 defines this constant's method as 'dividing the weight of LIVE LEAVES by the specific leaf weight', which is science::leaf_area_index over the standing leaf pool. [B]'s development-keyed alternative (Table 20's SLT) applies to NEW leaves and is therefore a different locus, not a re-reading of this number. See docs/log/sla-leaf-population.md"
  # ⚠ THE BASIS MATTERS HERE AND DIFFERS FROM ../nitrogen.yaml's USE OF THE SAME NUMBER.
  # This file applies the fraction to LEAF BLADE carbon, to fold specific_leaf_area into
  # m²/mol C; nitrogen.yaml applies it to the whole plant, and records a root delta ([C]
  # measures roots at 34.9 %, ~10 points below shoots, so a whole-plant use overstates
  # root C by ~29 %). That delta is NOT inherited here: the quantity this file converts
  # is leaf, and [C]'s straw figure (45.66 %, the above-ground vegetative fraction) is
  # the nearer of its two shoot measurements to a leaf blade. So the same citation binds
  # more tightly here than where it was first written down.
  carbon_fraction:
    value: 0.45
    unit: "dimensionless"
    source: "[C] Raimanova et al. (2024), Discussion: measured wheat C content 45.05 % (±0.81) in grain and 45.66 % (±1.09) in straw, which the paper itself calls 'near to the value of 45% used for the calculation of C content in plant dry mass'. Applied here to LEAF BLADE carbon, for which the straw (above-ground vegetative) figure is the nearer measurement; [C]'s root reading of 34.9 % is ~10 points lower, so this fraction is a SHOOT value and must not be read as a whole-plant one. ⚠ NOT a new retrieval: ../nitrogen.yaml has carried this exact citation for this exact value since 2026-07-16, under the MUST-EQUAL constraint between the two files, and ./crops/potato/canopy.yaml has described the reference value as 'cited' since 2026-08-11. The TODO(cite) here was stale, not open. Value unchanged at 0.45 — a provenance-only unfreeze, which the manifest records. ⚠ This string ended 'and no test can see' until 2026-09-06; slice C7 (2026-08-18) falsified that three days after it was written, because the reference now writes the manifest from the files it compiles in and tests/manifest_writer.rs compares the committed bytes — so a source:-only edit is stale-and-RED until regenerated. What is still honour-system is the CEREMONY, not the regeneration"
