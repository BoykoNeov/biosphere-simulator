# potato — canopy light interception (Beer–Lambert) parameters
#
# Read alongside ../../canopy.yaml (the FROZEN winter-wheat reference): the currency,
# the units discipline, and the interception law (Monsi & Saeki 1953) are documented
# there. Plan of record: docs/plans/post-roadmap-potato-crop.md.
#
# ONE of the three parameters below is potato's own and CITED; the other two are the
# reference crop's values, carried deliberately and labelled as such. This file is the
# clearest illustration of the honest position this whole crop takes: a species is only
# as species-specific as the literature on the shelf can make it, and pretending
# otherwise by inventing the rest would be worse than saying which is which.
#
# --- specific_leaf_area: CITED, and a real 1.5x difference ---------------------------
# [E] Table 19 tabulates SPECIFIC LEAF WEIGHT — the inverse quantity, in kg of leaf dry
# matter per hectare of leaf area. The conversion is a unit inversion, not a model:
#
#     SLA [m²/kg DM] = 10 000 [m²/ha] / SLW [kg/ha]
#
# Potato's row is 300 kg/ha → SLA = 33.33 m²/kg. The reference crop's own row in the
# SAME table is winter wheat, 425 kg/ha → 23.53 m²/kg. ⚠ RE-READ 2026-09-06: this was
# written as "a useful check in two directions" and EXACTLY ONE of them survived
# 2026-08-15, when ../../canopy.yaml retired its own placeholder and adopted that very
# row. (1) DEAD: "it corroborates the frozen file's uncited placeholder of 22.0 (within
# 7 %)" — the frozen value IS 10000/425 off this table now, so that leg compares the
# reference number to the row it comes from and agrees with itself. (2) STANDS: potato's
# thinner, broader leaf really is a ~1.5x difference in the SOURCE and not an artefact
# of our conversion — 300 and 425 are two DISTINCT rows, which no later adoption changes.
# Potato intercepts more light per unit of leaf carbon invested — which, in a habitat
# where carbon is the scarce thing, is exactly the sort of difference between crops that
# is worth being able to express.
#
# ⚠ WHAT THE TABLE'S OWN CAPTION SAYS ABOUT BOTH ROWS (retrieved 2026-09-06, off a page
#   render): these constants "are average values for the entire canopy", leaf blades one
#   surface, excluding petioles and leaf sheaths — NOT a young-leaf and NOT a mature-leaf
#   value. And p. 99 qualifies WHEN: the constant is a fair approximation "provided that
#   its value is measured at a proper time, such as at the end of the phase when most
#   assimilates go to the leaves", with Table 19 giving values "at about this stage".
#   Both facts apply to the potato row as much as to the wheat one. See
#   docs/log/sla-leaf-population.md.
#
# ⚠ READ OFF A PAGE IMAGE (PDF page 120 = printed page 100), never the text layer, for
#   the reason ./phenology.yaml records.
#
# --- extinction_coef and carbon_fraction: SHARED, and honestly so --------------------
# Neither is potato-specific, and neither is invented here. Both are the reference
# crop's committed values, carried unchanged. They are NOT equally justified, and the
# difference is stated rather than averaged:
#
#   extinction_coef — ⚠ RE-READ 2026-09-06: the reference value is NO LONGER a
#     placeholder. ../../canopy.yaml bound it that day to [B] p. 36, an ARCHITECTURE-class
#     coefficient ("about 0.6 for a canopy with erect leaves and 0.8 for one with
#     horizontal leaves"). That STRENGTHENS the reuse for wheat and WEAKENS it for potato
#     in the same sentence: the cited basis is leaf architecture, and potato's is the
#     opposite class, so the bias below is now a bias against a CITED class rather than a
#     guess about a placeholder. This entry read "reusing a placeholder, not borrowing a
#     wheat measurement" until then. It is still a WEAKER position than
#     ./phenology.yaml's shared FvCB block (which is at least tagged generic-C3),
#     because a broad-leaved determinate canopy and an erectophile cereal canopy really
#     do differ in extinction — planophile canopies typically sit HIGHER, nearer 0.8–1.0.
#     So this value is not merely uncited for potato, it is plausibly biased LOW, and
#     the direction of the bias is recorded here so nobody has to rediscover it. [E]
#     Table 19 carries no extinction column; a source that does is the successor.
#
#   carbon_fraction — the reference value 0.45 IS cited, but to a measurement of WHEAT
#     grain and straw. It is carried here because it MUST equal the value in the
#     nitrogen params (see below), and because the carbon fraction of plant dry matter
#     is genuinely narrow across species (~0.40–0.48). That makes reuse defensible, but
#     it is still a wheat number standing in for a potato one. NOT a potato citation.
#
# ⚠ THE CROSS-FILE CONSTRAINT, and why it is not a coincidence that it holds. The
#   reference nitrogen.yaml says carbon_fraction "MUST equal canopy.yaml's value" —
#   both files fold it (SLA → m²/mol C here; N thresholds → kg N/mol C there), and
#   divergent values would model a silently inconsistent plant. Potato overrides THIS
#   file but NOT nitrogen.yaml, so the constraint spans a crop boundary: potato's canopy
#   carbon fraction must equal the REFERENCE crop's nitrogen carbon fraction. It does,
#   because this file carries 0.45 unchanged — and that is pinned across every crop set
#   by rust/crates/domains/tests/potato_crop.rs, not left to this comment. ⚠ This line named
#   tests/test_potato_crop.py until 2026-09-06 — a file slice S6 deleted on 2026-08-27. The
#   pin itself never lapsed (potato stage 2 rebuilt it Rust-side), but the pointer outlived
#   its target by ten days and nothing could see it: a comment naming a deleted file is not
#   a broken reference to any tool.
#
# Clean-room: values from cited primary literature ONLY, never from the WOFOST potato
#   oracle's parameters (which are not read at all — see ./phenology.yaml).
#
# Sources:
#   [A] Monsi, M. & Saeki, T. (1953), "Über den Lichtfaktor in den
#       Pflanzengesellschaften und seine Bedeutung für die Stoffproduktion", Japanese
#       Journal of Botany 14:22–52 — the canopy extinction law (the FORM).
#   [E] Penning de Vries, F.W.T., Jansen, D.M., ten Berge, H.F.M. & Bakema, A. (1989),
#       "Simulation of Ecophysiological Processes of Growth in Several Annual Crops",
#       Simulation Monographs 29, PUDOC, Wageningen / IRRI, Los Baños.
#       ISBN 90-220-0937-8 (⚠ the check digit read "-2" here until 2026-09-06; the book's
#       own colophon page says -8, which is also what ../../canopy.yaml has always said).
#       Table 19, p. 100 — specific leaf weight by crop. The potato
#       row carries no per-row reference, which the table's own footnote defines as
#       "obtained from colleagues at CABO, Wageningen" — i.e. a PERSONAL COMMUNICATION,
#       weaker than a published measurement. Recorded, dated 2026-08-11, not glossed.
#   [F] Vos, J. — the reference our carbon_fraction would need to become potato-specific
#       is a potato dry-matter composition measurement; none is in sources/. Named here
#       as the shape of the missing source, NOT cited as if it had been read.

name: potato
process: canopy_light_interception

parameters:
  extinction_coef:
    value: 0.6
    unit: "dimensionless"
    source: "SHARED, not potato — the winter-wheat reference's committed value, carried unchanged. ⚠ RE-READ 2026-09-06: this said 'the reference's own TODO(cite) placeholder' until that day, when ../../canopy.yaml bound 0.6 to [B] p. 36 as an ARCHITECTURE-class coefficient — 'about 0.6 for a canopy with erect leaves and 0.8 for one with horizontal leaves'. ⚠ So the LOW bias for potato is now cited rather than guessed, and by the citation's own words: a broad-leaved planophile canopy belongs to [B]'s 0.8 class, not its 0.6 one, so reusing the wheat value here imports a coefficient the source assigns to the opposite architecture. [E] Table 19 carries no extinction column. The direction of the bias is recorded so a later session inherits the finding, not just the number"
  specific_leaf_area:
    value: 33.33
    unit: "m^2/kg"
    source: "Penning de Vries et al. (1989) Table 19 [E], potato row (verified off the page image): specific leaf WEIGHT 300 kg ha⁻¹, inverted to SLA = 10000/300 = 33.33 m² kg⁻¹ DM. The table's caption gives the population: these constants 'are average values for the entire canopy', leaf blades one surface, excluding petioles and leaf sheaths — and p. 99 gives the timing, 'measured at a proper time, such as at the end of the phase when most assimilates go to the leaves', with the table's values being 'at about this stage'. ⚠ RE-READ 2026-09-06: this string said 'CITED — where the reference crop's SLA remains TODO(cite)' until then, which had been FALSE since 2026-08-15, when ../../canopy.yaml adopted this same table's winter-wheat row. Of the corroboration that followed it, one leg died with that adoption and one stands: comparing 23.53 to 'the frozen file's placeholder 22.0' is now tautological (23.53 IS 10000/425 off this table), while potato's ~1.5× thinner leaf remains the SOURCE's difference and not our conversion's, because 300 and 425 are two distinct rows. ⚠ The potato row carries no per-row reference — the table footnote makes it a CABO personal communication, weaker than a published measurement"
  carbon_fraction:
    value: 0.45
    unit: "dimensionless"
    source: "SHARED, not potato — the reference value, which IS cited but to a measurement of WHEAT grain/straw (45.05 %/45.66 %). Carried unchanged for two reasons: the carbon fraction of plant dry matter is genuinely narrow across species (~0.40–0.48), and it MUST equal the carbon_fraction in the nitrogen params, which potato does NOT override — so a different value here would model a silently inconsistent plant across a crop boundary. Pinned in tests/test_potato_crop.py. NOT a potato citation"
