# winter_wheat — biomass senescence (relative organ death rates) crop params
# Currency/units: CARBON (mol). Senescence sheds standing organ carbon to the litter
#   BOUNDARY sink (distinct from the numerical extinction loss-sink): a relative death
#   rate (1/day) per organ, loss = rate · organ_c (mol C/day). Self-limiting (→ 0 as the
#   organ → 0), so positivity is structural.
#
# Units discipline (P4 / config/units.py): the relative death rates (1/day) are NOT a
#   conserved-Quantity canonical unit, so they are schema-validated, bound-checked floats
#   carrying a declared unit (exact-string guarded at the loader, like respiration's
#   maintenance_coef). A zero rate is valid (no turnover of that organ).
#
# Deferred Step-11 seam (documented in allocation.py): DVS / leaf-age / self-shading
#   keying of the death rate (the Step-6 maturity-seam shape). Standalone Step 9 is a
#   plain per-organ constant relative rate.
#
# ⚠ THAT SEAM WAS DIAGNOSED AND PRICED 2026-07-27 (option (C) of the nitrogen-cycle FORM
#   work; docs/plans/post-roadmap-nitrogen-cycle-form.md, "THE (C) DIAGNOSIS"). It is
#   REAL, it is FIRST-HAND, and it is NOT TAKEN — because closing it needs a science this
#   tree does not have, not a citation. Summary; the per-param tags below carry the rest.
#
#   [A] sec. 3.2.6 (p. 95) gives the descriptive form as a FUNCTION OF DEVELOPMENT STAGE
#   for LEAF and ROOT, and says of stems "except for their reserves, stems do not lose
#   weight". Its cited numerical example is Listing 5, "Crop data for rice (variety
#   IR36)" (p. 212):
#       FUNCTION LLVT = 0.0,0.0  1.0,0.0  1.3,0.007  1.8,0.012  2.5,0.012   (leaf)
#       FUNCTION LRTT = 0.0,0.0  1.0,0.0  1.3,0.011  1.8,0.010  2.5,0.010   (root)
#       (no stem function exists)
#   Read off the page image -- extraction garbles the numerals.
#
#   ⚠ AN EARLIER RECORD OF THIS QUOTED 0.15/day AS THE TERMINAL LEAF RATE. That is from
#   an EXERCISE ANSWER (p. 113, T10), not from the crop file sec. 3.2.6 cites; 12.5x
#   apart. See docs/retired/mineralization.yaml's dated correction. THE FORM CLAIM
#   SURVIVES BOTH READINGS (every one has the rate at ZERO below DS 1.0); only the
#   magnitude was mis-sourced.
#
#   MEASURED, running the DS-keyed form end-to-end against the frozen tree (read-only
#   probes; nothing built):
#     * PEAK CANOPY GOES UNPHYSICAL. open_season peak LAI 5.19 -> 16.40 against real
#       wheat's ~5-8 -- and BOTH source tables give the same peak (16.40 / 16.16),
#       because both are zero below DS 1.0. So THE FLAT rdr_leaf BELOW HAS BEEN STANDING
#       IN FOR CANOPY-REGULATION SCIENCE THE TREE DOES NOT HAVE (no self-shading leaf
#       death, no leaf-age cohorts, no SLA aging). Removing it -- which is what the
#       primary says to do -- exposes that gap. Corroborated against the primary's OWN
#       stated outcome ("a loss of 40-60 % of leaf area at harvest time", p. 95): the
#       FROZEN flat form lands at 38.5 %, Listing 5 at 30.0 %, the exercise table at
#       97.9 %. The flat rate was implicitly sized to give roughly the right INTEGRATED
#       loss while getting the TIMING entirely wrong -- shedding hardest where the source
#       says zero. ⚠ THAT COMPARISON IS INDICATIVE, NOT LIKE-FOR-LIKE: our run ends at
#       the end of the weather fixture rather than at "harvest time", the loss is
#       measured off PEAK LAI, and [A]'s sentence describes rice under a 102-135 day
#       season. It supports the ORDERING and rough magnitude -- none of the three is
#       inside the band -- not "38.5 % is our answer to a 40-60 % question", and no
#       distance-to-the-midpoint comparison is drawn.
#     * ⚠ STEM-ONLY WAS NOT MEASURED. Everything above runs the COMBINED form (leaf +
#       stem + root keyed together). Zeroing rdr_stem alone is the one piece of (C)
#       plausibly SEPARABLE from the canopy problem -- it shrinks the plant rather than
#       blowing up LAI -- so "(C) is refused" must NOT be read as "stem-only was
#       evaluated and refused". It was not evaluated.
#       ⚠⚠ MEASURED 2026-07-28, AND BOTH HALVES OF THAT PARENTHESIS ARE FALSE. Zeroing
#       rdr_stem GROWS the plant (open_season peak W 12.633 -> 13.639 t/ha, +7.96 %):
#       it is a LOSS term, so removing it retains carbon. And it does not separate from
#       the blocker -- `perennial` goes rationed 0 -> 1 UNDER EULER (the frozen
#       reference configuration), and the decade CO2 attractor collapses 0.05484 ->
#       0.01619 against the committed 0.05 floor. It IS separable from the canopy
#       problem, exactly as predicted -- peak LAI FALLS 5.191 -> 4.985 -- but the canopy
#       branch was already discharged, so separating from it buys nothing. THE BRANCH IS
#       NOW PRICED AND REFUSED, on a measurement rather than on absence. See the
#       rdr_stem tag below and tests/test_senescence_form.py section 7 (9 pins).
#     * CLOSURE BREAKS IN `perennial`. Euler reports rationed == 0 in all 8 scenarios
#       (the trap); under RK4 `perennial` HARD-ERRORS (ArbitrationError, scale_f
#       0.95277), and its decade per-year CO2 minimum falls from a settled 0.05484
#       attractor to a wandering 0.006-0.027 -- failing the 0.05 floor by ~an order and
#       losing stationarity. The exercise table is worse: annual_reset hard-errors ("seed
#       bank too small to re-sow") in all four reset-driven scenarios.
#     * IT IS A CARBON CHANGE, so it moves EVERY golden + both manifests + the Rust
#       mirror. open_season peak biomass 12.633 -> 18.678 t/ha (+47.8 %), which CROSSES
#       the 14.4248 t/ha Greenwood point tests/test_nitrogen_form.py pins: f_N drops to
#       0.995213 for 6/306 steps -- the FIRST time f_N bites in a frozen scenario.
#
#   ⚠ THE "MISSING CANOPY REGULATOR" WAS FOUND THE NEXT DAY, IN THIS SAME BOOK, AND IT
#   DOES NOT CHANGE THE VERDICT (2026-07-27; docs/plans/post-roadmap-canopy-regulator.md).
#   [A] p. 101 -- six pages after the sec. 3.2.6 quoted above, in the LEAF AREA section
#   rather than the SENESCENCE one -- reports:
#       "Van Keulen & Seligman (1987) calculated the rate of leaf area loss in wheat
#        independently of leaf weight loss. They put it at 5 % d-1 once the leaf area
#        exceeds the value of 6 m2 m-2 to account for mutual shading."
#   (Read off the page image; FLAT above the threshold, not proportional to the excess;
#   WHEAT, so no crop transfer; and it is [A] QUOTING V-K&S 1987, which is not on the
#   shelf -- first-hand [A], not first-hand V-K&S.) Our tree has no leaf-AREA state, but
#   specific_leaf_area is a single constant with no DVS keying, so LAI is linear in leaf
#   carbon and a relative area rate IS a relative carbon rate -- which is [A]'s own
#   stated default one sentence earlier. Limitation: V-K&S separated the two BECAUSE
#   specific leaf weight varies by cohort ([A] Figure 40, same page, ~230->530 kg/ha).
#
#   MEASURED: it takes open_season's peak LAI from 16.40 to 6.244 (inside real wheat's
#   ~5-8) with nothing fitted -- so the canopy half of the blocker is DISCHARGED. It
#   changes NOTHING else: it fires in exactly 1 of 8 scenarios, is BIT-IDENTICALLY inert
#   added to the frozen form, and `perennial` still hard-errors under RK4 at the
#   IDENTICAL scale_f 0.9527733243688737 (its peak LAI is ~0.56, 10x below the
#   threshold). The chambers are carbon-limited by design, so a mutual-shading rule --
#   a canopy-CLOSURE mechanism -- can never reach them. So the sentence in rdr_leaf's
#   tag below, "Blocked on a missing canopy regulator, not on retrieval", is HALF wrong
#   and is annotated in place rather than rewritten: the regulator was not missing, it
#   was unsearched-for; what actually blocks (C) is `perennial`'s CLOSURE, alone.
#
#   [A] permits calibrating the values ("These numbers can be used as default values, but
#   should be calibrated to mimick specific situations"). ⚠ REFUSED HERE: our only
#   available calibration target is closure of an artificial chamber and our own frozen
#   goldens, not observations -- the consumer-chamber-2x / DPM-RPM-labile / ruling-B
#   shape this project has refused before. If (C) is ever built, the table must come from
#   a source and the chambers must be shown to survive it, not the reverse.
#
# Clean-room: values from cited primary literature ONLY. NOT from the unlicensed
#   WOFOST_crop_parameters YAML or PCSE source. See docs/param-file-conventions.md.
#   All numeric VALUES are provisional, literature-typical placeholders pending the
#   Step-11 validation gate — flagged TODO(cite) until bound to a primary source.
#
# Sources:
#   [A] Penning de Vries, F.W.T., Jansen, D.M., ten Berge, H.F.M. & Bakema, A. (1989),
#       "Simulation of Ecophysiological Processes of Growth in Several Annual Crops",
#       Simulation Monographs, PUDOC, Wageningen (relative death-rate senescence).
#   [B] The same monograph, p. 101, quoting Van Keulen, H. & Seligman, N.G. (1987),
#       "Simulation of water use, nitrogen nutrition and growth of a spring wheat crop",
#       PUDOC, Wageningen — the mutual-shading leaf-area loss. Kept as its own tag
#       because it is a DIFFERENT primary source that [A] transmits; the locus is
#       [A]'s page, the claim is Van Keulen & Seligman's.
#       ⚠ PROVENANCE CAVEAT, stated because this project's citations fail on LOCUS
#       rather than on transmission: the underlying monograph is a **SPRING** wheat
#       crop, and [A] p. 101 generalises it to "the rate of leaf area loss in wheat".
#       We are winter wheat. The threshold is transmitted as a wheat-wide value by a
#       source we already rely on, and it is NOT re-fitted here — but a reader chasing
#       this number to its origin lands on a different cultivar type, and that is a
#       real (small) gap rather than a clean binding.

name: winter_wheat
process: senescence

parameters:
  rdr_leaf:
    value: 0.02
    unit: "1/day"
    source: "TODO(cite) — STILL OPEN, and as of 2026-07-27 it carries the heaviest finding in this file. [A]'s cited table (Listing 5, rice IR36, p. 212) is LLVT = 0.0/day at DS 0-1.0, 0.007 at DS 1.3, 0.012 at DS 1.8+ — so our 0.02/day flat is non-zero over the ENTIRE vegetative phase where the source is exactly zero, and ~1.7x the source's terminal rate where the source is fastest. FORM gap and VALUE gap, and the form is the load-bearing half. ⚠ BUT THE FLAT RATE IS DOING WORK THE SOURCE'S FORM DOES NOT REPLACE, which is why it is NOT moved: running the DS-keyed form end-to-end takes open_season's peak LAI from 5.19 to 16.40 (real wheat ~5-8), because the tree has no self-shading leaf death, no leaf-age cohorts and no SLA aging — this constant has been the canopy's only regulator on the way up. Measured on BOTH source tables, which give the same peak (16.40 / 16.16) since both are zero below DS 1.0, so it is not a reading question. Corroborating, and against the source's own table: [A] p. 95 says the descriptive form 'usually results in a loss of 40-60 % of leaf area at harvest time', and in our tree the FROZEN flat form gives 38.5 % while Listing 5 gives 30.0 % — the flat rate was implicitly sized to the right INTEGRATED loss with the timing entirely wrong. ⚠ AMPLIFIED BY CROP TRANSFER: rice IR36's whole season is 102-135 days, our winter wheat reaches anthesis at day ~251, so 'zero below DS 1.0' removes ~250 days of shedding rather than ~60 (e^-(0.02*250) ~ 0.0067). Changing it is a CARBON change: open_season peak biomass 12.633 -> 18.678 t/ha, crossing the 14.4248 t/ha Greenwood point pinned in tests/test_nitrogen_form.py (f_N 0.995213 for 6/306 steps — the first f_N bite in a frozen scenario), and `perennial` HARD-ERRORS under RK4 while reporting rationed == 0 under Euler. Blocked on a missing canopy regulator, not on retrieval. See docs/plans/post-roadmap-nitrogen-cycle-form.md, 'THE (C) DIAGNOSIS'. ⚠ CORRECTED 2026-07-27, the very next day: 'a missing canopy regulator' was FALSE — the regulator is in the SAME BOOK at p. 101 (Van Keulen & Seligman 1987 via [A]: 5 %/day of leaf area once LAI exceeds 6, for WHEAT), it was simply filed under LEAF AREA rather than SENESCENCE, and it takes the peak LAI from 16.40 to 6.244 with nothing fitted. It does NOT change this parameter's verdict, because it is BIT-IDENTICALLY inert on the frozen form and `perennial` hard-errors under RK4 at the IDENTICAL scale_f with it in place — the chambers peak at LAI 0.07-0.63 against a threshold of 6, so a mutual-shading rule cannot reach them. The blocker is `perennial`'s CLOSURE, alone. See the file header and docs/plans/post-roadmap-canopy-regulator.md."
  rdr_stem:
    value: 0.005
    unit: "1/day"
    source: "TODO(cite) — STILL OPEN, and 2026-07-27 sharpened it from a value gap to an EXISTENCE gap: [A] p. 95 states 'except for their reserves, stems do not lose weight', and Listing 5 (the crop file sec. 3.2.6 cites) carries LLVT and LRTT but NO stem death function at all. So this parameter is not merely uncited at 0.005/day — the source we cite for the senescence form says the quantity is zero. NOT set to zero, because that is a value change to a frozen param with a carbon effect, i.e. scope (C)/(D) work. ⚠ BUT DO NOT INHERIT rdr_leaf's BLOCKER HERE: the (C) diagnosis measured the COMBINED form, and stem-only is the one piece plausibly SEPARABLE from the canopy problem (zeroing stem death shrinks the plant rather than blowing up LAI). STEM-ONLY WAS NOT MEASURED, so this is unpriced, not priced-and-rejected. Recorded, not fitted. ⚠⚠ MEASURED 2026-07-28 — IT IS NOW PRICED, AND REFUSED, AND THE SENTENCE JUST ABOVE WAS WRONG TWICE. (i) 'shrinks the plant' is FALSE: rdr_stem is a LOSS term, so zeroing it retains stem carbon and open_season's peak W rises 12.633 -> 13.639 t/ha (+7.96 %), closing more than half the margin to the 14.4248 t/ha Greenwood crossing. It was a PREDICTION written in the grammar of a measurement — and it was not baseless, because three of the four organs really do shrink (leaf -3.96 %, root -3.91 %, storage -3.97 %, a common haircut whose measured cause is the extra maintenance respiration of a bigger standing stem, ~+1.49 mol C on open_season); what it did was name the whole plant for the behaviour of the majority of its organs while the one dissenting term (stem, +23.4 %) dominates. The honest reading is 'stem up, grain down' — the plant is bigger and worse. (ii) 'separable' is HALF false, and the surviving half is worthless: it IS separable from the canopy problem — peak LAI FALLS 5.191 -> 4.985, the two tripwires moving in OPPOSITE directions from one single-number change — but the canopy branch was already discharged by the regulator, so the only branch left is `perennial`'s CLOSURE, and stem-only hits it. MEASURED: `perennial` goes rationed 0 -> 1 UNDER EULER at dt=1, the frozen reference configuration (one firing is a hard break — the goldens assert rationed == 0 and run_scenario raises), and the decade per-year CO2 attractor collapses 0.05484 -> 0.01619 against the committed 0.05 floor, 3.4x too low WHILE STAYING STATIONARY (so the level guard catches it and a stationarity check alone would not). ⚠ AND THE INTEGRATOR PATTERN INVERTS: RK4 survives stem-only to a 15-year horizon with its CO2 minimum unmoved (0.075815 -> 0.075893), where the combined form hard-errored under RK4 and read clean under Euler. Neither integrator screens for the other; Euler is decisive here only because the biosphere is FROZEN at Euler. THE MECHANISM is a STANDING STOCK, not the litter starvation first hypothesised (the litter pool's mean falls ~13 % and microbial 0.5 %, against a 55 % fall in the CO2 trough): a sealed chamber's carbon inventory is fixed, a pool's equilibrium size goes as 1/(loss rate), so zeroing the rate makes the stem a one-way sink within a season and every other pool funds it — at sealed_chamber's trough, standing tissue +0.1179 mol C drawn ~67 % from the soil pools and ~33 % from the atmosphere. That is why the open field grows on the same change the chamber chokes on, and it is scope (A)'s finding 11 from the other side: a field-scale improvement is not a chamber-scale one. ⚠ Note also that the branch would OPEN a form gap rather than close one — see the scope note below: our single stem_c pool cannot express 'except for their reserves', so a zero death rate makes the stem strictly one-way. Refused on a MEASUREMENT, not on absence. tests/test_senescence_form.py section 7 (9 pins). ⚠ Note the scope of the quote: [A] says it while describing the MECHANISTIC variant, and 'except for their reserves' concedes stem reserve mobilization, which our single stem_c pool cannot express separately — so the honest reading is 'no structural stem death', not 'no stem carbon ever leaves'. See docs/plans/post-roadmap-nitrogen-cycle-form.md, 'THE (C) DIAGNOSIS' (C-finding 2)."
  # ⚠ THE CANOPY REGULATOR, BUILT 2026-08-15 — and note WHY it was built, because the
  # reason is not the one it was refused for. It sat measured-but-unbuilt since
  # 2026-07-27 because it is a LOSS: it could not fix a canopy that was too SMALL, which
  # is what it kept being proposed for (docs/plans/post-roadmap-canopy-regulator.md, and
  # again as a candidate in the direction plan's §6b). Binding specific_leaf_area to its
  # primary source inverted that: open_season's peak LAI reached 6.0228, crossing the
  # very threshold below, so the mechanism stopped being an unwanted loss and became a
  # mechanism the tree OWES — a cited source says leaves die in the regime the tree now
  # occupies. A recorded refusal is dated to the state that produced it.
  # ⚠ It does NOT pull the peak back under 6.0 (measured: the peak is bit-identically
  # unchanged), because the loss fires at/after the crossing and the crossing IS the
  # peak. It shapes the post-peak canopy, not the summit. The `peak < 6.0` band was
  # therefore restated rather than re-satisfied — see docs/biosphere-reference.md.
  shade_rate:
    value: 0.05
    unit: "1/day"
    source: "[B] p.101 (Van Keulen & Seligman 1987, for WHEAT): leaf area is lost at 5%/day once LAI exceeds 6, to account for mutual shading. A STEP, not a ramp — the source's own form. Cited on leaf AREA and applied to leaf CARBON; identical while SLA is a constant (see allocation.mutual_shading_rate)."
  lai_threshold:
    value: 6.0
    unit: "dimensionless"
    source: "[B] p.101 (Van Keulen & Seligman 1987): the 6 m^2/m^2 mutual-shading threshold. ⚠ Also the bound of a frozen science band, which is why crossing it is an event and not a number."
  rdr_root:
    value: 0.01
    unit: "1/day"
    source: "TODO(cite) — STILL OPEN, but 2026-07-27 found it is the CLOSEST of the three to its source and the finding is worth keeping separate from rdr_leaf's. [A]'s cited table (Listing 5, rice IR36, p. 212) gives LRTT = 0.0/day at DS 0-1.0, 0.011 at DS 1.3, 0.010 at DS 1.8+ — so our flat 0.01/day is within ~10 % of the source's post-anthesis plateau. The gap here is ONLY the form (zero before anthesis), with the magnitude already effectively literature-centred; do not quote the rdr_leaf 'runs fast' finding as covering all three. Unmoved for the same reason as its siblings: DS-keying is a carbon change that breaks `perennial`'s closure and needs a canopy regulator first. See docs/plans/post-roadmap-nitrogen-cycle-form.md, 'THE (C) DIAGNOSIS'."
