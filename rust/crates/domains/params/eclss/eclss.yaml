# eclss — cabin-air control-loop coefficients (Phase 5, Step 6)
# Currency/units: OXYGEN (mol), CARBON (mol), WATER (kg). The coefficients the ECLSS core
# introduces — the equipment properties of the three control loops. The forced crew
# metabolic RATES and the initial cabin inventories are scenario data (eclss/scenario.py; now rust/crates/domains/src/eclss.rs),
# NOT params (the biosphere/Power/Thermal data-vs-coefficient split).
#
# The standalone ECLSS domain holds three single-quantity cabin POOLs (cabin_o2 / cabin_co2
# / cabin_h2o) against a forced crew metabolic load, with three control loops driving each
# species to a steady state:
#     CO₂:  cabin_co2 → co2_removed,          R = k_scrub·max(0, cabin_co2 − co2_set)
#                                                                          ⇒ co2_eq = co2_set + P_co2/k_scrub
#     H₂O:  cabin_h2o → humidity_condensate,  R = k_cond·max(0, cabin_h2o − h2o_set)
#                                                                          ⇒ h2o_eq = h2o_set + P_h2o/k_cond
#     O₂:   o2_supply → cabin_o2,             S = k_makeup·(o2_setpoint − cabin_o2)
#                                                                          ⇒ o2_eq = o2_setpoint − Con_o2/k_makeup
# (P_* the forced crew production rates, Con_o2 the forced crew consumption — scenario data.)
#
# co2_scrub_rate (k_scrub) — CO₂ removal rate (1/s), > 0, on the EXCESS above the CO₂ target.
#   CDRA/LiOH scrubber. Structural positivity requires k_scrub·dt < 1 (donor-controlled,
#   self-limiting). With dt = 60 s here, k_scrub·dt = 0.6 < 1. ⚠ UNTIL 2026-10-19 this was
#   1.0e-3 on ALL the cabin's CO₂ (first-order), which settled every cabin at P/k — 3.796 mol,
#   400 ppm of the station's cabin, Earth's outdoor air, a level nobody chose. A one-sided
#   remover stands P/k ABOVE its target, so the rate rose with the form: at 1e-2 the station
#   crew's 3.796e-3 mol/s stands 0.38 mol (40 ppm) off, where 1e-3 would stand 400 ppm off
#   (docs/plans/post-roadmap-co2-level.md §6).
#
# co2_partial_pressure — the scrubber's target. The cabin CO₂ inventory it holds (mol) is
#   co2_partial_pressure / P_std x the cabin's air, computed where that air is known
#   (`EclssParams::co2_target_mol`): the station's 9500 mol cabin gives 12.188502343942758 mol
#   (1283 ppm), an authored habitat its own air. One-sided: below the target the scrubber takes
#   nothing (it cannot add CO₂). Plants and crew share one air here, so one level serves both;
#   the cabin holds the PLANTS' nominal, which is below every cited crew value.
#
# condense_rate (k_cond) — first-order humidity-condensation rate (1/s), > 0. Condensing
#   heat exchanger. Structural positivity requires k_cond·dt < 1 (here 0.03). Since
#   2026-10-03 it acts on the EXCESS above the humidity target, not on the whole cabin vapour.
#
# humidity_fraction + saturation_vapour_pressure — the condenser's target. The cabin water-vapour
#   inventory it holds (kg) is humidity_fraction x saturation_vapour_pressure / P_std x the
#   cabin's air x M_H2O, computed where that air is known (`EclssParams::humidity_setpoint_kg`):
#   the station's 9500 mol cabin gives 1.786315428255099 kg, an authored habitat its own air.
#   One-sided: below the target the condenser takes nothing (a condensing heat exchanger cannot
#   humidify). Until 2026-10-03 there was no target and the condenser drew first-order on all
#   of the cabin's vapour, so the cabin settled at P/k = 0.0675 kg — about 1.5 % relative
#   humidity, set by a solver-stability rate, not chosen by anyone
#   (docs/plans/post-roadmap-room-temperature.md §13a, §15).
#   ⚠ UNTIL 2026-10-18 THIS WAS `humidity_setpoint: 1.7863 kg` — the 40 % already multiplied by
#   the station's 9500 mol at 22 °C, which every authored cabin then inherited whatever its size
#   (docs/plans/post-roadmap-authored-plants.md §15). Its source's TRIGGER named two hidden
#   inputs; the air is now the cabin's own, the temperature is still a stored constant.
#   ⚠ WHY A PRESSURE, NOT A TEMPERATURE: stored as 295.15 K, every condenser build would run the
#   curve's exp, and three goldens (eclss, cabin_gas, water_recovery) are Tier 1 in
#   rust/data/tiers.json — transcendental-free, last-bit equal on any platform. As a pressure the
#   target is multiply and divide only; a test re-derives the pressure from the curve.
#
# o2_makeup_gain (k_makeup) — proportional gain of the O₂ partial-pressure regulator (1/s),
#   > 0. Gives O₂ its restoring force (so O₂ does not recapitulate Power's constructed
#   balance). The depleting side is the crew O₂ draw (scenario), sized so cabin_o2 never
#   empties — positivity by well-fed sizing (the LoadDraw discipline), not structural.
#
# o2_fraction — the O₂ mole fraction of the cabin air the regulator holds (dimensionless),
#   in (0, 1]. The regulator's target in moles is o2_fraction x the cabin's air at reference
#   pressure, computed where that air is known (`EclssParams::o2_setpoint_mol`): the station
#   passes its 9500 mol cabin (0.21 x 9500 = 1995.0, bit-exact), an authored habitat its own
#   declared air. It is the analogue of an O₂ partial-pressure setpoint at fixed cabin
#   volume/temperature — and because V and T ARE constants in this model, that analogy is an
#   exact proportionality rather than a hand-wave.
#   ⚠ UNTIL 2026-10-18 THIS WAS `o2_setpoint: 1995.0 mol` — the fraction already multiplied by
#   the station's 9500 mol. Its source carried a TRIGGER ("if an ECLSS is ever wired to a cabin
#   whose air is not 9500 mol, this MUST become a mole fraction"), and the condition was true
#   from the day it was written: scenarios/bioregenerative_station.yaml, an 8-mol cabin, drained
#   its O₂ tank every hour for six weeks with nothing going red. The cited quantity was always
#   the fraction; this is the trigger, fired (docs/plans/post-roadmap-authored-plants.md).
#
# Emergent (NOT params): the three steady states co2_eq / h2o_eq / o2_eq above are computed
#   (system.steady_state) from these coefficients + the forced crew rates, never stored —
#   each control loop IS a restoring force, so any constant crew load has a unique stable
#   steady state (no derived/tuned load, unlike Power's balanced_load_w).
#
# Units discipline (P4; now rust/crates/config/src/params.rs): none of these is a conserved-Quantity canonical
#   unit, so each is a schema-validated, bound-checked float carrying a declared unit
#   (exact-string guarded at the loader, like Power's charge_efficiency / Thermal's
#   emissivity), NOT routed through pint.
#
# Clean-room: first-order gas scrubbing/condensation and proportional partial-pressure
#   control are textbook process-control physics. The three RATES are DESIGN choices —
#   deliberately NOT NASA BVAD / BioSim life-support numbers; the three SETPOINTS are derived
#   from BVAD's cabin atmosphere (o2_setpoint 2026-09-06, humidity_setpoint 2026-10-03,
#   co2_partial_pressure 2026-10-19).
#
# PROVENANCE (post-roadmap bucket 3 scope C, 2026-07-16 — docs/plans/post-roadmap-citation.md).
#   All four TODO(cite) tags discharged as DESIGN. This file is the CLEAREST case in the
#   project of the distinction in docs/param-file-conventions.md ("Two provenance classes"):
#   [A] establishes that gas scrubbing is first-order and [B] that P-control is standard —
#   NEITHER says anything about whether OUR k is 1e-3 /s. Citing them for the values would
#   be fabrication. Each is a choice we made, and each says which constraint it satisfies.
#
#   Two structural reasons no source CAN fix these, worth recording because they are not
#   obvious and they foreclose a future "just go find the number" attempt:
#     * Real CO₂ removal (CDRA) is a CYCLIC two-bed thermal/pressure-swing adsorption
#       process with breakthrough behaviour — not a first-order decay at all. A lumped k is
#       our abstraction; real hardware is not characterized that way, so no paper reports
#       "k_scrub = 1e-3 /s". Same for the CCAA condensing heat exchanger, whose rate is set
#       by coolant temperature, airflow and dewpoint.
#     * ⚠ o2_setpoint WAS listed here as permanently un-bindable, on the grounds that a mol
#       inventory cannot carry a partial-pressure citation. RETIRED 2026-09-06 and the
#       reasoning was wrong in an instructive way: V and T are CONSTANTS in this model — there
#       is no volume state and no cabin thermodynamics — so a mole target and a ppO₂ target
#       differ by a fixed factor, and regulating one IS regulating the other. What was missing
#       was the derivation, not a model feature. The paragraph predicted its own fix ("derive
#       n from a cabin volume") and then called it a model change; it needed only Dalton's law
#       and the cabin's own air inventory, both already in the tree.
#       ⚠ It was ALSO not harmless while it stood. Six frozen respiration flows throttle by
#       f_O2 = x/(k + x) on this same pool (respiration.yaml o2_half_saturation = 1e-4), so
#       the 10 mol inventory against the greenhouse's 9500 mol air held the station's soil
#       respiration at f_O2 = 0.895 for four phases, where every correctly-charged chamber
#       sits at 0.9995. An uncited value is not an inert one.
#
#   REALITY CHECK on k_scrub (context, not a source — see [C]): the ISS CDRA runs a nominal
#   144-MINUTE bed-swing cycle (≈ 8 640 s) at 34.7 m³/hr. ⚠ Written 2026-07-16 for the old
#   1e-3: "our τ ≈ 1 000 s is ~8× SHORTER than the machine's period, ~1 to 1.5 orders fast".
#   The 8× compared a swing PERIOD with a removal time constant, which is the wrong
#   arithmetic (docs/plans/post-roadmap-co2-level.md §3). A flow-through bed removes
#   k = Q·η / V: one CDRA in the station's ~230 m³ cabin (9500 mol at 22 °C — our arithmetic,
#   [C] states no volume) gives k ≈ 4.2e-5 /s before η. Today's 1e-2 is ~240× that. It does
#   not set the level any more, only how tightly it is held; sizing k from the machine would
#   have reported the crew's 13.3× carbon oversizing as a cabin level (§3).
#
# Sources:
#   [A] Seader, J.D., Henley, E.J., Roper, D.K. (2011), "Separation Process Principles",
#       3rd ed., Wiley — first-order gas absorption / adsorption and condensation kinetics.
#       FORM ONLY. Commercial textbook, not openable here; never promoted to a value cite.
#   [B] Ogata, K. (2010), "Modern Control Engineering", 5th ed., Prentice Hall —
#       proportional (P) control of a setpoint-regulated first-order process. FORM ONLY.
#   [C] Watanabe, K., et al. (NASA Marshall Space Flight Center) (2015), "Optimization of
#       the Carbon Dioxide Removal Assembly (CDRA-4EU) in Support of the International
#       Space Station and Advanced Exploration Systems", ICES / NASA-NTRS 20150016500
#       (public domain): "the CDRA-4EU performance when flow rate was increase to
#       approximately 42.5 m3/hr (25 SCFM) from the the nominal flow of 34.7 m3/hr (20.4
#       standard cubic feet per minute (SCFM)), while the cycle time was reduced from the
#       nominal 144 minutes to 90 minutes, near the minimum that would allow time for the
#       CO2 sorbent beds to heat to the nominal set point of 204°C (400F)".
#       https://ntrs.nasa.gov/citations/20150016500
#       CONTRAST ONLY — real CDRA throughput/cadence, not the source of k_scrub.

name: eclss
process: cabin_air_control

parameters:
  co2_scrub_rate:
    value: 1.0e-2
    unit: "1/s"
    source: "DESIGN — tightness-of-hold choice, not a literature value: the scrubber removes k x the CO₂ ABOVE its target (co2_partial_pressure), so k sets how closely the cabin holds that level, not where it is. A one-sided proportional remover under a constant load stands P/k above its target: at the station crew's 3.796e-3 mol/s, 0.38 mol = 40 ppm (3 % above 0.13 kPa). k·dt = 0.6 < 1 at dt = 60 s (donor-controlled positivity). Form from [A]; the magnitude is ours. No source CAN fix it — real CDRA is cyclic swing adsorption, not a proportional remover. CONTRAST: one CDRA [C] in the station's ~230 m³ cabin gives k ≈ 4.2e-5 /s before capture efficiency (our arithmetic). ⚠ HISTORY: 1.0e-3 until 2026-10-19, first-order on ALL the cabin's CO₂, which settled it at P/k = 400 ppm, a level nobody chose (docs/plans/post-roadmap-co2-level.md). Not calibrated."
  co2_partial_pressure:
    value: 130.0
    unit: "Pa"
    source: "[D] BVAD Rev 2 Table 4-1 'Typical Steady-State Values for Vehicle Atmospheres', printed p. 63 (read as the page image, sources/temp-evidence/bvad/p63-077.png; the extracted text scrambles this table's columns), row 'p[CO2] for Plants (kPa)': 0.04 lower (Earth normal) / 0.13 NOMINAL ('accepted optimum for plant growth') / 3.4 upper (NASA Std. 3001). Taken: the plants' NOMINAL 0.13 kPa, the user's choice 2026-10-19 (docs/plans/post-roadmap-co2-level.md §7), as the CO₂ partial pressure the cabin scrubber holds. Plants and crew share one air here, so one level serves both: the same table's crew row is 0.267 lower / 0.507 nominal / 1.01 upper kPa (Law 2010), so 0.13 is below every cited crew value — the scrubber works harder than a real cabin's, which is allowed. Stored as a pressure, the unit the table prints; the target in mol is this / 101 325 Pa x the cabin's air (9500 mol gives 12.188502343942758, 1283 ppm). ⚠ The crop model has been checked against a real chamber at one CO₂ level, 1000 ppm (TM 102788, docs/log/real-world-checks.md), near this one; it carries no high-CO₂ penalty. Bounded > 0."
  condense_rate:
    value: 5.0e-4
    unit: "1/s"
    source: "DESIGN — solver-stability choice, not a literature value: humidity-condensation τ ≈ 2000 s, k·dt = 0.03 < 1 at dt = 60 s. First-order form from [A]; the magnitude is ours. No source CAN fix it — a real condensing heat exchanger's rate is set by coolant temperature, airflow and dewpoint, and is not published as a rate constant. No public-domain figure converting cleanly to a first-order k was found; none is asserted. Not calibrated."
  o2_makeup_gain:
    value: 2.0e-3
    unit: "1/s"
    source: "DESIGN — controller-tuning choice, not a literature value: proportional gain (τ ≈ 500 s) giving cabin O₂ its restoring force. The clearest DESIGN case in the file — a P gain is a property of the controller WE wrote, tuned against OUR plant and OUR dt. [B] supports the control law's form; no source can state our gain. Not calibrated."
  humidity_fraction:
    value: 0.40
    unit: "dimensionless"
    source: "[D] BVAD Rev 2 Table 4-1 'Typical Steady-State Values for Vehicle Atmospheres', printed p. 63 (read as the page image, 2026-10-03), row 'Relative Humidity, %': 25 lower (NASA Std. 3001 Vol 2 Rev A 2015) / 40 nominal ('Typical ISS') / 75 upper (NASA Std. 3001). Taken: the NOMINAL 40 %, as the relative humidity the cabin condenser holds — the quantity this file stores since 2026-10-18. ⚠ HISTORY: stored until 2026-10-18 as `humidity_setpoint: 1.7863 kg` = 0.40 x saturation at 22 °C x 9500 mol x M_H2O written to 5 figures, with a TRIGGER: it encoded the ONE cabin air inventory (9500 mol) AND a cabin temperature the model does not hold as a state. The air half is fired (the target takes the cabin's own air; docs/plans/post-roadmap-authored-plants.md §15); the temperature half stands, see saturation_vapour_pressure. Replaced 2026-10-03 a first-order draw on all the cabin's vapour that held it at ≈ 1.5 % RH. Bounded (0, 1]."
  saturation_vapour_pressure:
    value: 2643.931192210576
    unit: "Pa"
    source: "The model's own FAO-56 saturation curve (weather::saturation_vapor_pressure, 610.8 exp(17.27 T / (T + 237.3)) Pa) read at T = 22 °C = 295.15 K, BVAD Rev 2 Table 4-73's crew-cabin NOMINAL air temperature, printed p. 153 (nominal attributed there to Thirsk et al. 2009) — the figure's own locus; station/params/chamber.yaml borrows the same 295.15 K for the plant chamber by analogy. Written as the curve's f64 round-trip; a test re-derives it. Stored as a pressure rather than a temperature so the condenser's target needs no exp (three Tier-1 goldens, rust/data/tiers.json). ⚠ TRIGGER — the cabin has no heat store, so this is a fixed temperature, not the room's. When the cabin gets one, this MUST become a live read of its temperature; exp then enters every step, and eclss / cabin_gas / water_recovery leave Tier 1 inside that unfreeze."
  o2_fraction:
    value: 0.21
    unit: "dimensionless"
    source: "[D] BVAD Rev 2 §4.1.1 p. 61, verbatim: 'ISS EVA operations originate from 21% oxygen and 101.3 kPa (14.7 psia) of pressure'. Taken as the cabin COMPOSITION (a mole fraction of 0.21 for an ideal gas), which is the quantity this model needs and, since 2026-10-18, the quantity this file stores: the regulator's target in moles is this fraction times the cabin's air, supplied where the cabin is built (the station's 9500 mol; an authored habitat's own declared air). ⚠ HISTORY: stored until 2026-10-18 as `o2_setpoint: 1995.0 mol` = 0.21 x 9500, with a TRIGGER saying it MUST become a mole fraction if an ECLSS were ever wired to a cabin whose air is not 9500 mol — a condition already true when written (scenarios/bioregenerative_station.yaml's 8-mol cabin, which then drained its O2 tank hourly for six weeks; docs/plans/post-roadmap-authored-plants.md). The text of the 1995.0 value's source, from here on, is kept as written: which is the quantity this model needs — NOT Table 4-1's 'p[O2] for Crew; nominal no impairment' 21.2 kPa, which is a crew physiological requirement and a different quantity. n = 0.21 x 9500 mol = 1995.0, where 9500 mol is the cabin air inventory this tree models (station::scenario::greenhouse_bio_scenario chamber_air_mol, untouched here and NOT independently cited). ⚠ WHICH ATMOSPHERE IS A MODELLING CHOICE, not a lookup: the same page and Table 4-1 give three nominal total pressures (101 / 70.3 / 56.5 kPa) and a 34%-oxygen 57 kPa exploration option (Norcross 2013) for surface habitats; the crop reads the mole fraction, so 34% would give a materially different photosynthetic and microbial response. This habitat is modelled ISS-like and sea-level-equivalent. Cross-check across two loci (a consistency check, not a second derivation): Table 4-1's 21.2 kPa over 101.3 kPa is 20.93%, within 0.4% of 21%. ⚠ TRIGGER — this value silently encodes the ONE cabin air inventory within O2Makeup's reach (9500 mol; the other four ECLSS scenarios carry no air inventory at all). If an ECLSS is ever wired to a cabin whose air is not 9500 mol, this MUST become a mole fraction and the flow MUST read the air. Superseded the 10.0 mol DESIGN sizing choice 2026-09-06."
