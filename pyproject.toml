[project]
name = "biosphere-sim"
version = "0.0.0"
description = "Deterministic stock-and-flow station/biosphere simulation engine (Phase 0 skeleton)."
readme = "README.md"
requires-python = ">=3.12"
# ⚠ NO RUNTIME DEPENDENCIES since slice S6 (2026-08-27). `pydantic`, `pint` and
# `pyyaml` all existed for `src/config`, which is gone: `rust/crates/config` is the
# param-file boundary that counts (slice C1), and its exact unit-string guard replaced
# every live pint conversion — each of which had been measured to be an identity.
# What remains of this project in Python is a test harness and the PCSE oracle.
dependencies = []

[dependency-groups]
# PEP 735 dev group; `uv sync` installs it by default.
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "hypothesis>=6",
    "pyright>=1.1",
    "pytest-xdist>=3",
]
# PCSE (EUPL) is an OFFLINE validation oracle only (Phase 1, Step 3). It drags
# numpy + a large tree, so it stays a dev/test-only extra — never imported by the
# pure core (re-asserted by tests/test_simcore_purity.py) and skipped cleanly when
# absent (tests/oracle/ uses importorskip). See docs/reuse-and-licenses.md.
oracle = ["pcse"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# ⚠ ONE package, and it is a single path constant. S6 deleted `simcore`, `sim_io`,
# `domains`, `station` and `lab`; `config` survives only because
# `tests/crossport/regen_goldens_from_rust.py` reads `GOLDEN_DIR` from it, and both die
# together when that tool gets its Rust successor (S6 build item 2).
packages = ["src/config"]

[tool.ruff]
# Lint against the minimum supported version (the floor), not the dev version.
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `oracle` is opt-IN: it needs the heavy `oracle` dep group AND network (NASAPower),
# so — unlike `slow` — it must not run in the default loop, even on a machine that
# happens to have pcse installed. Opt-in is enforced override-proof in
# tests/conftest.py (an addopts `-m 'not oracle'` is NOT robust — a later `-m` such as
# the fast-loop `-m "not slow"` would override it). Run the oracle tests with
# `-m oracle`.
addopts = "-ra"
# `slow` is an opt-OUT handle, not deselected by default: a plain `uv run pytest`
# runs the marked tests (the 100k stability gates stay real), while a fast iteration
# loop skips them with `-m "not slow"`. The two 100k gates: tests/test_stability.py
# (the Phase-0.5 ENGINE A⇌B numerical gate, N6) and tests/test_biosphere_stress.py
# (the Phase-4 BIOSPHERE slow-drift gate — perennial + consumer to ~328 yr).
# ⚠ `slow` and `science_gate` are RETAINED WITH NO SUBJECT, deliberately and for one
# release only. S6 deleted every test carrying either: the 100k stability gates went with
# `test_stability.py` / `test_biosphere_stress.py`, and the science gates moved to
# `domains/src/biosphere/science_gates.rs` back in slice C4. They are listed here so that
# `--strict-markers` keeps working for anyone resuming an old branch, and so the removal
# is a decision rather than a silent side effect of a deletion. Drop them when the last
# three crossport gates go.
markers = [
    "slow: NO SUBJECT since S6 — long-running gates, all deleted with their tests",
    "oracle: PCSE/WOFOST oracle regeneration (needs the `oracle` dep group + network); skipped cleanly when pcse is absent (importorskip). Run with -m oracle.",
    "science_gate(scenario, field, quantity, bound, source): NO SUBJECT since S6 — the census moved to domains/src/biosphere/science_gates.rs in slice C4, where the roster row and the test that executes it are ONE declaration.",
]

[tool.pyright]
include = ["src", "tests"]
# `tests/oracle/` depends on the OPTIONAL `oracle` dep group (pcse, EUPL — an offline
# validation oracle, deliberately not a base dependency). CI's `uv sync` does not install
# it, so pyright would report `reportMissingImports` on the lazy `import pcse` in
# tests/oracle/runner.py and fail the Python job (it passes locally only because the dev
# venv happens to have pcse). The oracle runner is optional tooling over an untyped
# external lib; excluding it from type-checking keeps CI green without vendoring pcse. The
# default excludes are re-listed because setting `exclude` overrides them.
# ⚠ This exclusion now also covers `tests/oracle/match.py`, which S6 moved out of
# `src/lab/` so the carve-out stops reaching into the tree being deleted.
exclude = ["**/node_modules", "**/__pycache__", "**/.*", "tests/oracle"]
# `tests/crossport/` modules (`compare`, `regen_goldens_from_rust`, …) are imported by
# sibling directories through a runtime `sys.path.insert`, which pyright cannot follow.
# Naming the directory here type-checks those imports properly instead of silencing them
# per call site — the reference flip put one such import in `tests/golden_platform.py`,
# which is in `tests/`, not beside them.
extraPaths = ["tests/crossport"]
# Check against the supported floor (matches requires-python and ruff target),
# even though the dev interpreter is pinned to 3.13 via .python-version.
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
