[project]
name = "biosphere-sim"
version = "0.0.0"
description = "Deterministic stock-and-flow station/biosphere simulation engine (Phase 0 skeleton)."
readme = "README.md"
requires-python = ">=3.12"
# ⚠ NO RUNTIME DEPENDENCIES since slice S6 (2026-08-27). `pydantic`, `pint` and
# `pyyaml` all existed for `src/config`, which is gone: `rust/crates/config` is the
# param-file boundary that counts (slice C1), and its exact unit-string guard replaced
# every live pint conversion — each of which had been measured to be an identity.
# What remains of this project in Python is a test harness and the PCSE oracle.
dependencies = []

[dependency-groups]
# PEP 735 dev group; `uv sync` installs it by default.
# ⚠ `hypothesis>=6` and `pytest-xdist>=3` were removed on 2026-08-27 (S6 build item 3).
# Every property test and every parallel run went with the deleted suite: `grep` over
# `tests/` finds no `@given` and no `strategies`, and what is left is twelve tests that
# read committed JSON in under a second. They were not merely unused — `conftest.py`
# imported hypothesis at module scope to configure a profile for nothing, which made a
# dead dependency a single point of failure for the PCSE carve-out that collects
# through it.
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "pyright>=1.1",
]
# PCSE (EUPL) is an OFFLINE validation oracle only (Phase 1, Step 3). It drags
# numpy + a large tree, so it stays a dev/test-only extra — never imported by the
# pure core (re-asserted by tests/test_simcore_purity.py) and skipped cleanly when
# absent (tests/oracle/ uses importorskip). See docs/reuse-and-licenses.md.
oracle = ["pcse"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# ⚠ ONE package, and it is a single path constant. S6 deleted `simcore`, `sim_io`,
# `domains`, `station` and `lab`; `config` survives because `tests/oracle/runner.py` reads
# `WINTER_WHEAT_WEATHER` from it.
# ⚠⚠ This comment said the package dies with S6 build item 2 — it named
# `regen_goldens_from_rust.py`/`GOLDEN_DIR` as the last reader. Item 2 landed, the tool is
# gone, and the package is still here: the PCSE carve-out reaches in too, and it outlives
# the checker. Item 3 deleted the five unread constants instead.
packages = ["src/config"]

[tool.ruff]
# Lint against the minimum supported version (the floor), not the dev version.
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `oracle` is opt-IN: it needs the heavy `oracle` dep group AND network (NASAPower),
# so — unlike `slow` — it must not run in the default loop, even on a machine that
# happens to have pcse installed. Opt-in is enforced override-proof in
# tests/conftest.py (an addopts `-m 'not oracle'` is NOT robust — a later `-m` such as
# the fast-loop `-m "not slow"` would override it). Run the oracle tests with
# `-m oracle`.
addopts = "-ra"
# ⚠ ONE marker. `slow` and `science_gate` stood here with NO SUBJECT from S6 (2026-08-27)
# until 2026-09-02, under a paragraph granting them "one release" of grace so that
# `--strict-markers` kept working on old branches. This project has no releases, so the
# grace had no end — a grace period denominated in an event that never happens is a
# permanent exemption. Dropped; the CI step that filtered on `slow` now runs plain
# `pytest`. Where they went: the 100k stability gates were deleted with
# `test_stability.py` / `test_biosphere_stress.py`; the science-gate census lives in
# `rust/crates/domains/src/biosphere/science_gates.rs` (slice C4), where the roster row
# and the test that executes it are ONE declaration.
markers = [
    "oracle: PCSE/WOFOST oracle regeneration (needs the `oracle` dep group + network); skipped cleanly when pcse is absent (importorskip). Run with -m oracle.",
]

[tool.pyright]
include = ["src", "tests"]
# `tests/oracle/` depends on the OPTIONAL `oracle` dep group (pcse, EUPL — an offline
# validation oracle, deliberately not a base dependency). CI's `uv sync` does not install
# it, so pyright would report `reportMissingImports` on the lazy `import pcse` in
# tests/oracle/runner.py and fail the Python job (it passes locally only because the dev
# venv happens to have pcse). The oracle runner is optional tooling over an untyped
# external lib; excluding it from type-checking keeps CI green without vendoring pcse. The
# default excludes are re-listed because setting `exclude` overrides them.
# ⚠ This exclusion now also covers `tests/oracle/match.py`, which S6 moved out of
# `src/lab/` so the carve-out stops reaching into the tree being deleted.
exclude = ["**/node_modules", "**/__pycache__", "**/.*", "tests/oracle"]
# ⚠ `extraPaths = ["tests/crossport"]` stood here until 2026-08-27. It existed because
# modules in that directory were imported across it through a runtime `sys.path.insert`,
# which pyright cannot follow. S6 items 1-3 deleted the directory, so the setting pointed
# at nothing — a configuration line that resolves to no path is not inert, it is a silent
# claim that something is being type-checked.
# Check against the supported floor (matches requires-python and ruff target),
# even though the dev interpreter is pinned to 3.13 via .python-version.
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
